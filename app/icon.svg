<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="notype">
  <!--
    「話す」が「整った文章」になる、を波形で表す。
    小さいサイズでも潰れないよう、バーは4本、線幅は太めにしてある。
  -->
  <rect width="100" height="100" rx="23" fill="#4C3CE0" />
  <g fill="#FFFFFF">
    <rect x="20" y="41" width="9" height="18" rx="4.5" />
    <rect x="35" y="32" width="9" height="36" rx="4.5" />
    <rect x="50" y="23" width="9" height="54" rx="4.5" />
    <rect x="65" y="35" width="9" height="30" rx="4.5" />
  </g>
</svg>
