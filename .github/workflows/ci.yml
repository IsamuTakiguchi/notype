name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへ続けて push されたら、古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: 型・lint・単体テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 依存を導入
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 単体テスト
        run: npm test

      - name: 本番ビルド
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 依存を導入
        run: npm ci

      # Playwright はバージョンと Chromium リビジョンが1対1なので、
      # lock ファイルをキーにすればバージョン変更で確実に無効化される。
      - name: ブラウザのキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # キャッシュヒット時、ダウンロードは自動でスキップされる。
      # OS 依存パッケージはキャッシュに含まれないので毎回入れる。
      - name: Chromium を用意
        run: npx playwright install --with-deps chromium

      # playwright.config.ts の webServer が build と next start を面倒みる。
      - name: E2E
        run: npm run e2e

      - name: レポートとスクリーンショットを保存
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore
